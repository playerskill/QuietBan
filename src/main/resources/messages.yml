# Все сообщения плагина. Поддерживаются цветовые коды (&a, &c, &l и т.д.)
# Плейсхолдеры: {player} {reason} {type} {initiator} {initrn} {time} {expiry}

prefix: "&8[&bQuietBan&8] &7"
no-permission: "&cУ вас недостаточно прав."
command-usage: "&7Использование: &f/quietban <reload|check <ник>>"
reload-success: "&aКонфигурация перезагружена."
check-not-found: "&aИгрок &f{player} &aне найден в бан-листе."
check-db-error: "&cОшибка базы данных. Подробности в консоли."

# Ответ команды /quietban check <ник>, когда игрок забанен
check-found:
  - "&8&m----------&r &bQuietBan &8&m----------"
  - "&cИгрок &f{player} &cзабанен:"
  - "&7Тип: &f{type}"
  - "&7Причина: &f{reason}"
  - "&7Модератор: &f{initiator}"
  - "&7InitRN: &f{initrn}"
  - "&7Выдан: &f{time}"
  - "&7Истекает: &f{expiry}"
  - "&8&m--------------------------------"

# Экран отключения, который видит ТОЛЬКО забаненный игрок (соединение
# разрывается тихо, без сообщений в чат). Строки склеиваются переводом строки.
kick-screen:
  - "&c&lВы заблокированы на этом сервере"
  - ""
  - "&7Причина: &f{reason}"
  - "&7Модератор: &f{initiator}"
  - "&7Выдан: &f{time}"
  - "&7Истекает: &f{expiry}"

# Если в базе причина пустая
kick-no-reason: "&7Причина не указана"
# Если в базе модератор пустой
kick-no-initiator: "&7—"
# Если у бана нет срока окончания (expiry <= 0)
ban-forever: "&cНавсегда"
# Экран кика, когда база недоступна и fail-open: false
kick-db-error: "&cНе удалось проверить бан-лист. Попробуйте зайти позже."
