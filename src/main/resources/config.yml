# ------------------------------------------------------------------
#  QuietBan — тихий кик забаненных игроков из базы данных.
#  При входе игрока в лобби плагин делает запрос в MySQL, и если
#  игрок найден в бан-листе — разрывает соединение, показав причину
#  ТОЛЬКО на экране игрока. В чат ничего не пишется.
#
#  Изначальная схема рассчитана на EasyBans (таблица banlist),
#  но название таблицы и ВСЕ столбцы настраиваются самостоятельно.
# ------------------------------------------------------------------

database:
  # Адрес и порт MySQL-сервера
  host: "localhost"
  port: 3306
  # Имя базы данных, пользователь и пароль
  name: "bans"
  user: "root"
  password: "password"
  # Название таблицы с банами
  table: "banlist"
  # Имена столбцов — впишите свои, как они названы в вашей таблице
  columns:
    id: "id"              # уникальный номер записи (для ORDER BY — берётся самая свежая)
    object: "object"      # кого забанили (ник или UUID — см. match-by)
    type: "type"          # тип наказания (ban / tempban / ...)
    reason: "reason"      # причина — показывается игроку на экране кика
    initiator: "initiator" # кто выдал бан
    initrn: "initrn"      # доп. поле модератора
    expiry: "expiry"      # окончание бана (timestamp в секундах/миллисекундах или "YYYY-MM-DD HH:MM:SS"; 0 = навсегда)
    time: "time"          # время выдачи бана
  # Что лежит в столбце object: NAME — ник игрока, UUID — его UUID
  match-by: "NAME"
  # Если задано — баном считается только строка, где столбец type равен этому значению (например "ban").
  # Оставьте пустым, если подходят любые строки.
  type-filter: ""
  # true — баны с истёкшим expiry пропускаются (игрок пускается в лобби);
  # expiry <= 0 или нечисловое пустое значение считается вечным баном
  check-expiry: true
  # true — если база данных недоступна, игрок пускается в лобби;
  # false — игрок кикается с сообщением kick-db-error (fail-closed)
  fail-open: true

settings:
  # Формат дат (выдача бана и окончание) на экране кика и в /quietban check
  date-format: "dd.MM.yyyy HH:mm"
